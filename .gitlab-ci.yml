stages:
  - build
  - docker

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

build-distributable:
  stage: build
  image: ubuntu:22.04
  when: manual
  before_script:
    - apt-get update && apt-get install -y curl unzip zip fontconfig libfreetype6
    # Install JetBrains JDK 25
    - curl -fsSL "https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-25.0.1-linux-x64-b234.26.tar.gz" -o /tmp/jbr.tar.gz
    - mkdir -p /opt/jbr && tar -xzf /tmp/jbr.tar.gz -C /opt/jbr --strip-components=1
    - export JAVA_HOME=/opt/jbr
    - export PATH="$JAVA_HOME/bin:$PATH"
    - java -version
  script:
    - chmod +x ./gradlew
    - ./gradlew createReleaseDistributable --no-daemon --console=plain
    - cd ui/build/compose/binaries/main-release/app
    - zip -r "$CI_PROJECT_DIR/epa-visualizer.zip" "EPA Visualizer"
  artifacts:
    paths:
      - epa-visualizer.zip
    expire_in: 1 hour

build-docker:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  needs:
    - build-distributable
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # Move the built zip into the kasm/ build context
    - cp epa-visualizer.zip kasm/epa-visualizer.zip
    - docker build -t "$CI_REGISTRY_IMAGE:latest" kasm/
    - docker push "$CI_REGISTRY_IMAGE:latest"
