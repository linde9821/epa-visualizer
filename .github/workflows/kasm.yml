name: Kasm Docker Image

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-distributable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-java@v5
        with:
          distribution: 'jetbrains'
          java-version: '25'
          cache: 'gradle'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Build Distributable
        run: ./gradlew createReleaseDistributable --no-daemon --console=plain
      - name: Zip distributable
        run: |
          cd ui/build/compose/binaries/main-release/app
          zip -r "$GITHUB_WORKSPACE/epa-visualizer.zip" "EPA Visualizer"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: epa-visualizer-zip
          path: epa-visualizer.zip
          retention-days: 1

  build-docker:
    runs-on: ubuntu-latest
    needs: build-distributable
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Download distributable
        uses: actions/download-artifact@v4
        with:
          name: epa-visualizer-zip
          path: kasm/
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: kasm/
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/kasm:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/kasm:${{ github.sha }}
